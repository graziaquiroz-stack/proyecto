<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCampus - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="bg-primary text-white text-center py-4 shadow">
        <div class="container">
            <h1 class="display-5 fw-bold">Foro y Contacto</h1>
            <p class="lead">Déjanos tus consultas o solicitudes</p>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MindCampus</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="citas.html">Salud Mental</a></li>
                    <li class="nav-item"><a class="nav-link" href="rutinas.html">Bienestar Físico</a></li>
                    <li class="nav-item"><a class="nav-link" href="recetas.html">Nutrición</a></li>
                    <li class="nav-item"><a class="nav-link active" href="formulario.html">Foro y Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row">
            <div class="col-lg-8">
                <div class="p-4 bg-white rounded shadow-sm border-start border-primary border-4 mb-4">
                    <h2 class="text-primary mb-3">Envíanos un Mensaje</h2>
                    <form id="contactoForm">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="correo" placeholder="correo@cibertec.edu.pe" required>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
                    </form>
                </div>
            </div>
            <div class="col-lg-4">
                <aside class="p-4 bg-white rounded shadow-sm">
                    <h5 class="text-secondary fw-bold mb-3">Créditos</h5>
                    <p class="small text-muted mb-0">Grazia Teresa Quiroz Véliz y equipo</p>
                </aside>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container"><p class="mb-0">&copy; 2026 MindCampus</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
